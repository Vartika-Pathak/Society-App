          description: Vendor not found

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Member:
      type: object
      required: [id, name, flatNumber, joinedAt]
      properties:
        id:
          type: integer
        name:
          type: string
        flatNumber:
          type: string
        bio:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        joinedAt:
          type: string
          format: date-time

    Event:
      type: object
      required: [id, title, date, location, createdAt]
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        date:
          type: string
          format: date-time
        location:
          type: string
        organizer:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    EventInput:
      type: object
      required: [title, date, location]
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        date:
          type: string
          format: date-time
        location:
          type: string
          minLength: 1
        organizer:
          type: string

    NewsPost:
      type: object
      required: [id, title, content, author, publishedAt]
      properties:
