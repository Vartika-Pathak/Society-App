kind = "web"
previewPath = "/"
title = "Pavilion"
version = "1.0.0"
id = "artifacts/pavilion"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25513

[services.development]
run = "pnpm --filter @workspace/pavilion run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pavilion", "run", "build" ]
serve = "static"
publicDir = "artifacts/pavilion/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25513"
BASE_PATH = "/"
