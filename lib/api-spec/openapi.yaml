openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Pavilion community website API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: members
    description: Resident members
  - name: events
    description: Community events
  - name: news
    description: News and blog posts
  - name: gallery
    description: Photo gallery
  - name: join
    description: Membership join requests
  - name: contact
    description: Contact messages
  - name: stats
    description: Community statistics
  - name: auth
    description: Account signup, login, and session
  - name: visits
    description: Visitor entry — residents log visitors and get an OTP, guards approve/deny at the gate
  - name: maintenance
    description: Maintenance requests — residents report issues with photos, staff track them to resolution
  - name: complaints
    description: Complaints — residents raise an issue by category, guard/admin track it to resolution
  - name: emergency
    description: Emergency alerts — one-tap alert visible to neighbors, guard, and admin until resolved
  - name: amenities
    description: Amenity booking, with Stripe Checkout for amenities that require payment
  - name: society
    description: Society profile — admin-only, one record describing the society itself
  - name: buildings
    description: Buildings master data — admin-only
  - name: flats
    description: Flats master data — admin-only
  - name: expense-categories
    description: Expense categories with GST slabs — admin-only
  - name: vendors
    description: Vendors — admin-only
  - name: maintenance-rates
    description: Per-flat-type monthly maintenance amounts — admin-only
  - name: maintenance-settings
    description: Society-wide maintenance billing settings — admin-only, one record
  - name: maintenance-discounts
    description: Maintenance discount rules — admin-only
  - name: special-contributions
    description: One-off charges announced to every flat — admin-only
  - name: vendor-bills
    description: Vendor bills for maintenance expenses — admin-only
  - name: bill-payments
    description: Payments recorded against vendor bills — admin-only
  - name: maintenance-collections
    description: Maintenance payments recorded against a flat — admin-only
  - name: reports
    description: Derived financial reports and dashboard summaries, computed from Masters and Transactions data — admin-only
  - name: audit-logs
    description: A record of admin writes (create/update/delete), captured automatically — admin-only, read-only
  - name: society-rules
    description: Society rules & regulations, each with an active/inactive status — admin-only to manage
  - name: services
    description: A directory of local services (plumber, electrician, etc.) — admin-only to manage
  - name: notices
    description: Short operational notices, distinct from the news/blog feed — admin-only to manage
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /members:
    get:
      operationId: listMembers
      tags: [members]
      summary: List all active members
      responses:
        "200":
          description: List of members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Member"

  /members/{id}:
    get:
      operationId: getMember
      tags: [members]
      summary: Get a member by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Member found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "404":
          description: Member not found

  /events:
    get:
      operationId: listEvents
      tags: [events]
      summary: List all events
      responses:
        "200":
          description: List of events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"
    post:
      operationId: createEvent
      tags: [events]
      summary: Create a new event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventInput"
      responses:
        "201":
          description: Event created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"

  /events/upcoming:
    get:
      operationId: getUpcomingEvents
      tags: [events]
      summary: Get upcoming events (next 5)
      responses:
        "200":
          description: Upcoming events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"

  /events/{id}:
    get:
      operationId: getEvent
      tags: [events]
      summary: Get an event by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Event found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "404":
          description: Event not found
    delete:
      operationId: deleteEvent
      tags: [events]
      summary: Delete an event
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Event deleted

  /news:
    get:
      operationId: listNewsPosts
      tags: [news]
      summary: List all news posts
      responses:
        "200":
          description: List of news posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NewsPost"
    post:
      operationId: createNewsPost
      tags: [news]
      summary: Create a news post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewsPostInput"
      responses:
        "201":
          description: Post created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsPost"

  /news/latest:
    get:
      operationId: getLatestNewsPosts
      tags: [news]
      summary: Get the 3 latest news posts
      responses:
        "200":
          description: Latest news posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NewsPost"

  /news/{id}:
    get:
      operationId: getNewsPost
      tags: [news]
      summary: Get a news post by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: News post found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsPost"
        "404":
          description: Not found
    delete:
      operationId: deleteNewsPost
      tags: [news]
      summary: Delete a news post
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Post deleted

  /gallery:
    get:
      operationId: listGalleryPhotos
      tags: [gallery]
      summary: List all gallery photos
      responses:
        "200":
          description: List of gallery photos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GalleryPhoto"
    post:
      operationId: addGalleryPhoto
      tags: [gallery]
      summary: Upload a photo to the gallery (admin only)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/GalleryPhotoUploadInput"
      responses:
        "201":
          description: Photo added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GalleryPhoto"
        "401":
          description: Not signed in
        "403":
          description: Not an admin

  /gallery/{id}:
    delete:
      operationId: deleteGalleryPhoto
      tags: [gallery]
      summary: Delete a gallery photo
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Photo deleted

  /join-requests:
    post:
      operationId: submitJoinRequest
      tags: [join]
      summary: Submit a membership join request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinRequestInput"
      responses:
        "201":
          description: Join request submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinRequest"

  /contact:
    post:
      operationId: sendContact
      tags: [contact]
      summary: Send a contact message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactMessageInput"
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactMessage"

  /stats:
    get:
      operationId: getCommunityStats
      tags: [stats]
      summary: Get community statistics
      responses:
        "200":
          description: Community stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityStats"

  /auth/signup:
    post:
      operationId: signup
      tags: [auth]
      summary: Create an account and start a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupInput"
      responses:
        "201":
          description: Account created, session cookie set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "409":
          description: Email already registered

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in and start a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Session cookie set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Invalid email or password

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current session
      responses:
        "204":
          description: Session cookie cleared

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the currently signed-in user
      responses:
        "200":
          description: Signed-in user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Not signed in

  /visits:
    post:
      operationId: createVisit
      tags: [visits]
      summary: Log a visitor and generate an entry OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VisitInput"
      responses:
        "201":
          description: Visit logged, OTP generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Visit"
        "401":
          description: Not signed in
    get:
      operationId: listAllVisits
      tags: [visits]
      summary: List every visit ever logged across the society, newest first (guard/admin only)
      responses:
        "200":
          description: Every visit, with the resident who logged it
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VisitLogEntry"
        "401":
          description: Not signed in
        "403":
          description: Not a guard or admin

  /visits/mine:
    get:
      operationId: listMyVisits
      tags: [visits]
      summary: List the current resident's own visit entries, newest first
      responses:
        "200":
          description: This resident's visits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Visit"
        "401":
          description: Not signed in

  /visits/lookup:
    post:
      operationId: lookupVisit
      tags: [visits]
      summary: Look up a pending visit by its OTP (guard/admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VisitLookupInput"
      responses:
        "200":
          description: Visit found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisitLookupResult"
        "401":
          description: Not signed in
        "403":
          description: Not a guard or admin
        "404":
          description: No matching pending OTP (wrong code, already decided, or expired)

  /visits/{id}/decide:
    post:
      operationId: decideVisit
      tags: [visits]
      summary: Approve or deny a visit (guard/admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VisitDecisionInput"
      responses:
        "200":
          description: Visit updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Visit"
        "401":
          description: Not signed in
        "403":
          description: Not a guard or admin
        "404":
          description: Visit not found

  /maintenance:
    get:
      operationId: listMaintenanceRequests
      tags: [maintenance]
      summary: List maintenance requests — residents see only their own, guard/admin see everyone's
      responses:
        "200":
          description: Maintenance requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MaintenanceRequest"
        "401":
          description: Not signed in
    post:
      operationId: createMaintenanceRequest
      tags: [maintenance]
      summary: Report a maintenance issue, optionally with photos
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/MaintenanceRequestInput"
      responses:
        "201":
          description: Request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceRequest"
        "401":
          description: Not signed in

  /maintenance/status:
    post:
      operationId: updateMaintenanceStatus
      tags: [maintenance]
      summary: Update a maintenance request's status (guard/admin only)
      parameters:
        - in: query
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaintenanceStatusInput"
      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceRequest"
        "401":
          description: Not signed in
        "403":
          description: Not a guard or admin
        "404":
          description: Request not found

  /maintenance/confirm:
    post:
      operationId: confirmMaintenanceResolved
      tags: [maintenance]
      summary: The resident confirms they're satisfied with a resolved request, closing it
      parameters:
        - in: query
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Request closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceRequest"
        "400":
          description: Not currently resolved
        "401":
          description: Not signed in
        "403":
          description: Not your request
        "404":
          description: Request not found

  /maintenance/reopen:
    post:
      operationId: reopenMaintenanceRequest
      tags: [maintenance]
      summary: The resident isn't satisfied with a resolved request, so it goes back to open
      parameters:
        - in: query
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Request reopened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceRequest"
        "400":
          description: Not currently resolved
        "401":
          description: Not signed in
        "403":
          description: Not your request
        "404":
          description: Request not found

  /vehicles:
    get:
      operationId: listVehicles
      tags: [vehicles]
      summary: List vehicles — residents see only their own, guard/admin see everyone's
      responses:
        "200":
          description: Vehicles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Vehicle"
        "401":
          description: Not signed in
    post:
      operationId: registerVehicle
      tags: [vehicles]
      summary: Register a vehicle against the signed-in resident's account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehicleInput"
      responses:
        "201":
          description: Vehicle registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"
        "400":
          description: Validation error
        "401":
          description: Not signed in
        "402":
          description: The resident's flat doesn't have a parking pass yet
    delete:
      operationId: deleteVehicle
      tags: [vehicles]
      summary: Remove a vehicle — the owning resident or an admin only
      parameters:
        - in: query
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Vehicle removed
        "401":
          description: Not signed in
        "403":
          description: Not your vehicle
        "404":
          description: Vehicle not found

  /complaints:
    get:
      operationId: listComplaints
      tags: [complaints]
      summary: List complaints — residents see only their own, guard/admin see everyone's
      responses:
        "200":
          description: Complaints
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Complaint"
        "401":
          description: Not signed in
    post:
      operationId: createComplaint
      tags: [complaints]
      summary: Raise a complaint by category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComplaintInput"
      responses:
        "201":
          description: Complaint created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Complaint"
        "401":
          description: Not signed in

  /complaints/{id}/status:
    post:
      operationId: updateComplaintStatus
      tags: [complaints]
      summary: Update a complaint's status, optionally with a note the resident can see (guard/admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComplaintStatusInput"
      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Complaint"
        "401":
          description: Not signed in
        "403":
          description: Not a guard or admin
        "404":
          description: Complaint not found

  /complaints/{id}/confirm:
    post:
      operationId: confirmComplaintResolved
      tags: [complaints]
      summary: The resident confirms they're satisfied with a resolved complaint, closing it
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Complaint closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Complaint"
        "400":
          description: Not currently resolved
        "401":
          description: Not signed in
        "403":
          description: Not your complaint
        "404":
          description: Complaint not found

  /complaints/{id}/reopen:
    post:
      operationId: reopenComplaint
      tags: [complaints]
      summary: The resident isn't satisfied with a resolved complaint, so it goes back to open
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComplaintReopenInput"
      responses:
        "200":
          description: Complaint reopened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Complaint"
        "400":
          description: Not currently resolved
        "401":
          description: Not signed in
        "403":
          description: Not your complaint
        "404":
          description: Complaint not found

  /emergency-alerts:
    post:
      operationId: raiseEmergencyAlert
      tags: [emergency]
      summary: Raise an emergency alert (or return the caller's existing active one)
      responses:
        "201":
          description: Alert active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmergencyAlert"
        "401":
          description: Not signed in

  /emergency-alerts/mine:
    get:
      operationId: getMyEmergencyAlert
      tags: [emergency]
      summary: The caller's own active alert, if any
      responses:
        "200":
          description: Caller's active alert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmergencyAlert"
        "204":
          description: No active alert for the caller
        "401":
          description: Not signed in

  /emergency-alerts/active:
    get:
      operationId: listActiveEmergencyAlerts
      tags: [emergency]
      summary: All currently active alerts — visible to every signed-in resident, guard, and admin
      responses:
        "200":
          description: Active alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmergencyAlert"
        "401":
          description: Not signed in

  /emergency-alerts/{id}/resolve:
    post:
      operationId: resolveEmergencyAlert
      tags: [emergency]
      summary: Mark an alert resolved — the reporting resident, or any guard/admin
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Alert resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmergencyAlert"
        "401":
          description: Not signed in
        "403":
          description: Not the reporting resident, a guard, or an admin
        "404":
          description: Alert not found

  /amenities:
    get:
      operationId: listAmenities
      tags: [amenities]
      summary: List bookable amenities
      responses:
        "200":
          description: Amenities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Amenity"
        "401":
          description: Not signed in

  /amenities/availability:
    get:
      operationId: getAmenityAvailability
      tags: [amenities]
      summary: Which slots are already booked for an amenity on a given date
      parameters:
        - in: query
          name: amenityId
          required: true
          schema:
            type: string
        - in: query
          name: date
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Booked slots
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AmenityAvailability"
        "401":
          description: Not signed in
        "404":
          description: Unknown amenity

  /amenities/bookings/mine:
    get:
      operationId: listMyAmenityBookings
      tags: [amenities]
      summary: The current resident's own amenity bookings
      responses:
        "200":
          description: This resident's bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AmenityBooking"
        "401":
          description: Not signed in

  /amenities/bookings:
    post:
      operationId: bookAmenity
      tags: [amenities]
      summary: Book an amenity slot — confirms immediately if free, otherwise starts a Stripe Checkout session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookAmenityInput"
      responses:
        "200":
          description: Booking confirmed, or a Stripe Checkout session to complete payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookAmenityResult"
        "401":
          description: Not signed in
        "404":
          description: Unknown amenity
        "409":
          description: That slot is already booked

  /amenities/bookings/confirm:
    post:
      operationId: confirmAmenityBooking
      tags: [amenities]
      summary: Confirm a booking after a successful Stripe Checkout redirect
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmAmenityBookingInput"
      responses:
        "200":
          description: Booking confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AmenityBooking"
        "401":
          description: Not signed in
        "402":
          description: Payment was not completed
        "409":
          description: Payment succeeded but the slot was taken meanwhile — refunded automatically

  /parking:
    get:
      operationId: getMyParkingPass
      tags: [parking]
      summary: The signed-in resident's flat's parking pass, or null if it hasn't been bought yet
      responses:
        "200":
          description: The flat's parking pass, or an empty body if none exists
          content:
            application/json:
              schema:
