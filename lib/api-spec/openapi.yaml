components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Member:
      type: object
      required: [id, name, flatNumber, joinedAt]
      properties:
        id:
          type: integer
        name:
          type: string
        flatNumber:
          type: string
        bio:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        joinedAt:
          type: string
          format: date-time

    Event:
      type: object
      required: [id, title, date, location, createdAt]
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        date:
          type: string
          format: date-time
        location:
          type: string
        organizer:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    EventInput:
      type: object
      required: [title, date, location]
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        date:
          type: string
          format: date-time
        location:
          type: string
          minLength: 1
        organizer:
          type: string

    NewsPost:
      type: object
      required: [id, title, content, author, publishedAt]
      properties:
        id:
          type: integer
        title:
          type: string
        content:
          type: string
        excerpt:
          type: ["string", "null"]
        author:
          type: string
        imageUrl:
          type: ["string", "null"]
        publishedAt:
          type: string
          format: date-time

    NewsPostInput:
      type: object
      required: [title, content, author]
      properties:
        title:
          type: string
          minLength: 1
        content:
          type: string
          minLength: 1
        excerpt:
          type: string
        author:
          type: string
          minLength: 1
        imageUrl:
          type: string

    GalleryPhoto:
      type: object
      required: [id, imageUrl, uploadedAt]
      properties:
        id:
          type: integer
        imageUrl:
          type: string
        title:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        uploadedBy:
          type: ["string", "null"]
        uploadedAt:
          type: string
          format: date-time

    GalleryPhotoUploadInput:
      type: object
      required: [photo]
      properties:
        photo:
          type: string
          format: binary
        title:
          type: string
        description:
          type: string

    JoinRequestInput:
      type: object
      required: [name, email, flatNumber]
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
        flatNumber:
          type: string
          minLength: 1
        message:
          type: string

    JoinRequest:
      type: object
      required: [id, name, email, flatNumber, status, submittedAt]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        flatNumber:
          type: string
        message:
          type: ["string", "null"]
        status:
          type: string
        submittedAt:
          type: string
          format: date-time

    ContactMessageInput:
      type: object
      required: [name, email, subject, message]
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
        subject:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1

    ContactMessage:
      type: object
      required: [id, name, email, subject, message, submittedAt]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        subject:
          type: string
        message:
          type: string
        submittedAt:
          type: string
          format: date-time

    CommunityStats:
      type: object
      required: [totalMembers, upcomingEventsCount, totalNewsPosts, totalGalleryPhotos]
      properties:
        totalMembers:
          type: integer
        upcomingEventsCount:
          type: integer
        totalNewsPosts:
          type: integer
        totalGalleryPhotos:
          type: integer

    SignupInput:
      type: object
      required: [name, email, flatNumber, password]
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
        flatNumber:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 8
        captchaToken:
          type: string
          description: Not used by this (Node) backend — present so the shared frontend can send it when talking to the Java backend, which does verify it.

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
        captchaToken:
          type: string
          description: Not used by this (Node) backend — present so the shared frontend can send it when talking to the Java backend, which does verify it.

    AuthUser:
      type: object
      required: [id, name, email, flatNumber, role, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        flatNumber:
          type: string
        role:
          type: string
          enum: [resident, guard, admin]
        createdAt:
          type: string
          format: date-time

    Visit:
      type: object
      required: [id, visitType, visitorName, otpCode, status, expiresAt, createdAt]
      properties:
        id:
          type: integer
        visitType:
          type: string
          enum: [cab_delivery, guest, household_help, maintenance_staff]
        visitorName:
          type: string
        visitorPhone:
          type: ["string", "null"]
        otpCode:
          type: string
        status:
          type: string
          enum: [pending, approved, denied, revoked]
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    VisitInput:
      type: object
      required: [visitType, visitorName, visitorPhone]
      properties:
        visitType:
          type: string
          enum: [cab_delivery, guest, household_help, maintenance_staff]
        visitorName:
          type: string
          minLength: 1
        visitorPhone:
          type: string
          minLength: 1

    VisitLookupInput:
      type: object
      required: [otpCode]
      properties:
        otpCode:
          type: string
          minLength: 1

    VisitLookupResult:
      type: object
      required:
        [
          id,
          visitType,
          visitorName,
          status,
          expiresAt,
          createdAt,
          residentName,
          residentFlatNumber,
        ]
      properties:
        id:
          type: integer
        visitType:
          type: string
          enum: [cab_delivery, guest, household_help, maintenance_staff]
        visitorName:
          type: string
        visitorPhone:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, approved, denied, revoked]
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        residentName:
          type: string
        residentFlatNumber:
          type: string

    VisitLogEntry:
      type: object
      required:
        [
          id,
          visitType,
          visitorName,
          status,
          expiresAt,
          createdAt,
          residentName,
          residentFlatNumber,
        ]
      properties:
        id:
          type: integer
        visitType:
          type: string
          enum: [cab_delivery, guest, household_help, maintenance_staff]
        visitorName:
          type: string
        visitorPhone:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, awaiting_verification, approved, denied, revoked]
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        residentName:
          type: string
        residentFlatNumber:
          type: string

    VisitDecisionInput:
      type: object
      required: [approve]
      properties:
        approve:
          type: boolean

    MaintenanceRequest:
      type: object
      required:
        [
          id,
          category,
          description,
          photoUrls,
          status,
          residentName,
          residentFlatNumber,
          createdAt,
        ]
      properties:
        id:
          type: integer
